name: Create new release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Fetch Moodle Boost dependency
        run: |
          mkdir -p ../boost
          git clone --depth 1 --branch MOODLE_405_STABLE https://github.com/moodle/moodle.git /tmp/moodle
          cp -r /tmp/moodle/theme/boost/* ../boost/
          rm -rf /tmp/moodle

      - name: Compile assets
        run: npm run build

      - name: Package release artifact
        run: |
          mkdir -p dist/nhsetel
          rsync -av --progress . dist/nhsetel \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.vs' \
            --exclude 'package*.json'
          cd dist
          zip -r "../${{ github.ref_name }}.zip" nhsetel
          cd ..

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ github.ref_name }}.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}